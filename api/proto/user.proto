syntax = "proto3";

package bocchi.user.v1;

option go_package = "bocchi/api/gen/user/v1;userv1";

import "google/protobuf/timestamp.proto";
import "common.proto";

// User represents a user account (MVP version)
message User {
  string id = 1;
  string email = 2;
  string name = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
}

// Request to get a user by ID
message GetUserRequest {
  string id = 1;
}

// Response for getting a user
message GetUserResponse {
  User user = 1;
}

// Request to get a user by email
message GetUserByEmailRequest {
  string email = 1;
}

// Response for getting a user by email
message GetUserByEmailResponse {
  User user = 1;
}

// Request to create a new user (MVP version)
message CreateUserRequest {
  string email = 1;
  string name = 2;
}

// Response for user creation
message CreateUserResponse {
  User user = 1;
}

// UserService provides gRPC methods for user operations
service UserService {
  // Get a user by ID
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
  
  // Get a user by email
  rpc GetUserByEmail(GetUserByEmailRequest) returns (GetUserByEmailResponse);
  
  // Create a new user
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
}